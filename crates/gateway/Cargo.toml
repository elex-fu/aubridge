[package]
name = "gateway"
description = "axum 网关:组装 L0+L1,路由/安全中间件/候选循环/上游转发与翻译接线"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
manifest = { workspace = true }
ledger = { workspace = true }
proto = { workspace = true }
registry = { workspace = true }
credentials = { workspace = true }
router = { workspace = true }
translate = { workspace = true }
agents = { workspace = true }
axum = { workspace = true, features = ["query"] }
tokio = { workspace = true, features = ["process", "io-util"] }
reqwest = { workspace = true }
httpdate = "1.0.3"
serde = { workspace = true }
serde_json = { workspace = true }
getrandom = { workspace = true }
futures-core = { workspace = true }
futures-util = { workspace = true }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
zstd = { version = "0.14.3", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
sha2 = { workspace = true }
ring = "=0.17.14"
semver = "=1.0.28"
plist = "=1.10.3"
zip = { version = "=9.3.0", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
reqwest = { workspace = true }
rusqlite = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "test-util"] }
