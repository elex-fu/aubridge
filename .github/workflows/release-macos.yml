name: macOS package

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Distribution requires Developer ID and notarization secrets
        type: choice
        options: [development, distribution]
        default: development
        required: true

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      AUBRIDGE_RELEASE_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Pinned Rust and Tauri CLI
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          cargo install tauri-cli --version 2.12.4 --locked
      - name: Prepare notarization key
        if: inputs.mode == 'distribution'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          value = os.environ.get('APPLE_API_KEY_BASE64', '')
          if not value:
              raise SystemExit('Distribution requires APPLE_API_KEY_BASE64')
          path = Path(os.environ['RUNNER_TEMP']) / 'aubridge-notary-key.p8'
          with path.open('xb') as stream:
              os.chmod(path, 0o600)
              stream.write(base64.b64decode(value, validate=True))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'APPLE_API_KEY_PATH={path}\n')
          PY
      - name: Check, sign, notarize, verify and archive
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: python3 scripts/release-macos.py build --mode "$AUBRIDGE_RELEASE_MODE"
      - name: Remove temporary notarization key
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          (Path(os.environ['RUNNER_TEMP']) / 'aubridge-notary-key.p8').unlink(missing_ok=True)
          PY
      - name: Preserve packages and evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ inputs.mode }}-${{ github.sha }}
          include-hidden-files: true
          path: |
            .local/releases/*/*.zip
            .local/releases/*/receipt.json
            .local/releases/*/SHA256SUMS
            .local/releases/*/checks.json
            .local/releases/*/checks.log
            .local/releases/*/bundle.log
          if-no-files-found: warn
